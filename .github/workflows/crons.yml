name: External cron jobs

on:
  schedule:
    - cron: "*/5 * * * *"   # process-reports every 5 min
    - cron: "0 * * * *"     # cleanup-interviews hourly
  workflow_dispatch:

concurrency:
  group: cron-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  process-reports:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping process-reports
        run: |
          curl -fsS --max-time 240 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/process-reports"

  cleanup-interviews:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping cleanup-interviews
        run: |
          curl -fsS --max-time 240 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/cleanup-interviews"
